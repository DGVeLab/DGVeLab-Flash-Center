name: Sync JoyDeck 1 releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joydeck1-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install RAR extraction support
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Import released firmware and update catalog
        run: python3 scripts/sync_joydeck1.py
      - name: Commit updated firmware catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/catalog.json firmware/joydeck1/
          if ! git diff --cached --quiet; then
            git commit -m "Sync JoyDeck 1 official firmware releases"
            git push
          else
            echo "No release changes detected."
          fi
